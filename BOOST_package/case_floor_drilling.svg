<g font-size="10.5" fill="#4a5550">
<text x="150.0" y="834.0" font-weight="700" fill="#1a2320">NOTES</text>
<text x="150.0" y="848.0">1. Datum: inside top-left corner of the case floor, as in the case layout (box = board + 22, -28). All dimensions in mm.</text>
<text x="150.0" y="862.0">2. The floor is 10 mm thick and the case is sealed: blind holes only, drill depth 8.5 mm maximum, bottoming tap.</text>
<text x="150.0" y="876.0">3. M3: 7.0 mm of full thread minimum, for the 6 mm nylon stud of the H5-H8 standoffs (the stud must not bottom).</text>
<text x="150.0" y="890.0">4. M2.5: 6.0 mm of full thread minimum, for the FET tab screws (M2.5 x 12 pan head, 4.9 mm engaged).</text>
<text x="150.0" y="904.0">5. Light 90&#176; countersink to thread diameter so the standoff hex and the thermal pads seat flat. Deburr.</text>
<text x="150.0" y="918.0">6. Nylon threads in aluminium: assemble hand-tight only.</text>
<text x="150.0" y="932.0">7. Rev B changes notes and layout only: all eight positions are unchanged from rev A (placement p15_b10_k2).</text>
</g>
<g font-size="11" fill="#1a2320">
<text x="150.0" y="26.0" font-weight="700">BOOST power board &#8212; case floor drilling</text>
<text x="150.0" y="44.0" fill="#4a5550" font-size="10.5">rev B 2026-09-16 &#183; placement p15_b10_k2 &#183; 8 holes &#183; not to scale: work from the hole table</text>
