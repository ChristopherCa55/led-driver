<g font-size="10.5" fill="#4a5550">
<text x="458.0" y="658.0">Coordinates are from the inside top-left corner of the case floor, the same datum as the case layout</text>
<text x="458.0" y="672.0">(box = board + 22, -28). All dimensions in mm.</text>
<text x="458.0" y="686.0">Tap depth 5 mm minimum, blind: do not break through the floor (the case is sealed).</text>
<text x="458.0" y="700.0">M2.5 holes take the FET tab screws through the board and the TO-220 tab; M3 holes take the standoffs</text>
<text x="458.0" y="714.0">that carry the board and the control card. Deburr both sides; keep the sealing face clean.</text>
<text x="458.0" y="728.0">Hole positions are fixed by placement p15_b10_k2 and do not move with the open lug/U16 question.</text>
</g>
